services:
  db:
    image: postgres:16-alpine
    container_name: badminton-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: badminton
      POSTGRES_PASSWORD: badminton
      POSTGRES_DB: badminton
    ports:
      - "5432:5432"
    volumes:
      - badminton_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badminton -d badminton"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  badminton_pgdata:
