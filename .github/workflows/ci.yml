name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: badminton
          POSTGRES_PASSWORD: badminton
          POSTGRES_DB: badminton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U badminton"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://badminton:badminton@localhost:5432/badminton_test?schema=public
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
      DEFAULT_PHONE_REGION: IN

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests (DB)
        run: npx vitest run tests/integration
        env:
          RUN_DB_TESTS: "1"

      - name: Build
        run: npm run build
