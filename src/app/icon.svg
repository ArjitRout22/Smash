<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#059669"/>
  <!-- feathered skirt: wide open at the top, tapering to the cork -->
  <path d="M6.5 6.5 L25.5 6.5 L19 21.5 L13 21.5 Z" fill="#ffffff"/>
  <!-- feather ribs fanning up from the cork -->
  <g stroke="#059669" stroke-width="1" stroke-linecap="round">
    <line x1="16" y1="20.5" x2="9.5" y2="8"/>
    <line x1="16" y1="20.5" x2="16" y2="7.5"/>
    <line x1="16" y1="20.5" x2="22.5" y2="8"/>
  </g>
  <!-- cork base -->
  <path d="M13 21.5 L19 21.5 A3.3 3.3 0 0 1 13 21.5 Z" fill="#0f766e"/>
</svg>
