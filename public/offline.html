<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · Smash</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#0b1120;color:#e6efe9;
      font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:24px}
    .card{max-width:340px}
    .badge{width:56px;height:56px;border-radius:14px;background:#059669;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px}
    h1{font-size:20px;margin:0 0 8px}
    p{color:#8ea298;font-size:14px;line-height:1.6;margin:0 0 20px}
    button{background:#059669;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🏸</div>
    <h1>You're offline</h1>
    <p>Smash needs a connection for live scores and standings. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
